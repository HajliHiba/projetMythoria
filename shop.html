<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HOLLOW KNIGHT. Buy your boosters.">
    <title>BOOSTER SHOP | HOLLOW KNIGHT</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style type="text/tailwindcss">
        @theme {
            --color-void: #0b0d14;
            --color-bone: #e8e4d8;
            --font-title: "Cinzel", Georgia, serif;
            --font-body: "Lora", Georgia, serif;
        }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Lora:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
</head>

<body class="w-full bg-void font-body text-bone">

    <header
        class="relative min-h-[30vh] w-full bg-[url(images/hollowknightheader.jpg)] bg-cover bg-center bg-no-repeat">

        <div class="absolute inset-0 bg-black/30" aria-hidden="true"></div>

        <div class="relative mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-4 px-4 py-4">
            <a href="index.html" class="flex items-center gap-3 font-title text-xl font-bold tracking-widest">
                <img src="images/logo.jpg" alt="" width="48" height="48" class="h-12 w-auto">
                HOLLOW KNIGHT
            </a>

            <input type="checkbox" id="menu-toggle" class="peer sr-only">
            <label for="menu-toggle"
                class="cursor-pointer rounded border border-bone/60 px-3 py-2 text-sm peer-focus-visible:ring-2 peer-focus-visible:ring-bone md:hidden">
                Menu
            </label>

            <nav aria-label="Main navigation"
                class="hidden w-full flex-col gap-1 peer-checked:flex md:flex md:w-auto md:flex-row md:gap-6">
                <a href="index.html" class="border-b-2 border-transparent py-2 hover:border-bone">HOME</a>
                <a href="shop.html" aria-current="page" class="border-b-2 border-bone py-2">BOOSTER SHOP</a>
                <a href="chamber.html" class="border-b-2 border-transparent py-2 hover:border-bone">OPENING CHAMBER</a>
                <a href="grimoire.html" class="border-b-2 border-transparent py-2 hover:border-bone">MY GRIMOIRE</a>
                <a href="cards.html" class="border-b-2 border-transparent py-2 hover:border-bone">MY DECK</a>
            </nav>
        </div>
    </header>

    <main class="mx-auto max-w-6xl px-4 py-12">

        <h1 class="text-center font-title text-4xl font-bold tracking-widest">BOOSTER SHOP</h1>
        <p class="mx-auto mt-4 max-w-md text-center">Choose your boosters and add them to your cart.</p>

        <div class="mt-10 grid gap-8 lg:grid-cols-3">

            <section class="grid gap-6 sm:grid-cols-2 lg:col-span-2" aria-label="Boosters">

                <article data-name="Beginner Pack" data-price="4.99"
                    class="flex flex-col items-center rounded-lg border border-bone/20 bg-blue-900 p-5 text-center">
                    <h2 class="font-title text-lg font-bold">Beginner Pack</h2>
                    <img src="images/pack1.jpg" alt="Beginner Pack picture"
                        class="my-4 h-64 max-w-full rounded-md object-contain drop-shadow-xl">
                    <p class="text-sm">A pack designed for new players, with a mix of common cards and a few higher
                        rarity cards.</p>
                    <p class="mt-2 text-sm italic">5 cards: heroes, monsters, minions, spells</p>
                    <p class="mt-3 font-title text-2xl font-bold">4.99 €</p>
                    <div class="mt-3 flex items-end gap-3">
                        <div>
                            <label class="block text-sm">Quantity
                                <input type="number" min="1" max="10" value="1"
                                    class="block w-20 rounded border border-bone/50 bg-void px-2 py-2">
                            </label>
                        </div>
                        <button type="button"
                            class="add-btn rounded-md bg-blue-800 px-4 py-2 font-bold text-white hover:bg-blue-700">Add
                            to cart</button>
                    </div>
                </article>
